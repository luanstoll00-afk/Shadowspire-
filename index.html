  button:disabled { opacity: .45; cursor: not-allowed; }
  #map {

    border: 3px solid #6b5a2e; border-radius: 6px;
  }
  .center { text-align: center; }
  .small { font-size: 12px; color: #c7c0aa; }
  #log {
    height: 100px; overflow-y: auto; background: #090910;
    padding: 8px; font-size: 13px; line-height: 1.5;
  }
  #shop { display: none; }
  #shopItems { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 6px; }
  .item { background: #20202c; border: 1px solid #444; padding: 8px; border-radius: 5px; }
  #controls {
    display: grid; grid-template-columns: repeat(3,52px);
    justify-content: center; gap: 4px; margin: 8px auto 0;
  }
  #controls button { height: 46px; margin: 0; font-size: 18px; touch-action: none; }
  #nickInput {
    background: #090910; color: #eee5cc; border: 1px solid #6b5a2e;
    padding: 9px; border-radius: 5px; font: inherit;
  }
  @media (max-width: 500px) {
    #game { padding: 7px; }
    h1 { font-size: 20px; }
    #stats span { font-size: 12px; }
  }
</style>

  <div id="gameUI" style="display:none">

    <div class="panel center">

      <button onclick="changeScene('masmorra')">🏰 Masmorra</button>
      <button onclick="changeScene('caverna')">🕳 Caverna Profunda</button>
      <div id="sceneInfo" class="small"></div>
    </div>

    <canvas id="map" width="800" height="480"></canvas>

    <div class="panel center">
      <button onclick="attack()">⚔ Atacar (E)</button>
      <button onclick="heal()">🧪 Poção (Q)</button>
      <button onclick="toggleShop()">🛒 Loja</button>
      <p class="small">Ande com WASD ou as setas. Aproxime-se dos monstros e ataque.</p>
      <div id="controls">
        <span></span><button data-key="ArrowUp">▲</button><span></span>
        <button data-key="ArrowLeft">◀</button>
        <button data-key="ArrowDown">▼</button>
        <button data-key="ArrowRight">▶</button>
      </div>
    </div>

    <div id="shop" class="panel">

      <div id="shopItems"></div>
      <p class="center"><button onclick="toggleShop()">Fechar loja</button></p>
    </div>

    <div class="panel">
      <b>Registro da aventura</b>
      <div id="log"></div>
    </div>
  </div>
</div>
